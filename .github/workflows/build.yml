name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dist/DesktopSmartOrganizer.exe
          - os: macos-latest
            artifact: dist/DesktopSmartOrganizer-macos.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1
      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: bash ./scripts/build_macos.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopSmartOrganizer-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
